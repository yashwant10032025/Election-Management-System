<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Login - State Election Commission</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background-color: #f8faff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            max-width: 450px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background: white;
            border: 0;
        }

        .login-header {
            background: #1565c0;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .captcha-box {
            overflow: hidden;
            position: relative;
            background-image: repeating-linear-gradient(
                45deg,
                #f8f9fa,
                #f8f9fa 10px,
                #e9ecef 10px,
                #e9ecef 20px
            );
        }

        .captcha-text {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            mix-blend-mode: multiply;
        }

        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #1565c0;
        }

        .form-control:focus {
            border-color: #1565c0;
            box-shadow: 0 0 0 0.25rem rgba(21, 101, 192, 0.25);
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <div class="login-header">
            <h5 class="mb-0 d-flex align-items-center">
                <i class="fas fa-user-lock me-2"></i> Official Login
            </h5>
            <a href="index.html" class="btn-close btn-close-white" aria-label="Close"></a>
        </div>
        
        <div class="p-4">
            
            <div class="text-center mb-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Emblem_of_India.svg/250px-Emblem_of_India.svg.png" 
                     alt="Emblem" style="height: 60px;" class="mb-2">
                <h6 class="text-muted mb-0">State Election Commission</h6>
            </div>

            <form action="index.html">
                
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="Username" autocomplete="username" required>
                    <label for="username">Username</label>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password" required>
                    <label for="password">Password</label>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted" style="font-size: 0.85rem;">Security CAPTCHA</label>
                    <div class="d-flex align-items-center gap-2">
                        <div class="captcha-box d-flex align-items-center justify-content-center border rounded position-relative flex-grow-1" style="height: 45px; user-select: none;">
                            <canvas class="captcha-noise w-100 h-100 position-absolute" style="opacity: 0.4; pointer-events: none;"></canvas>
                            <span class="captcha-text fw-bold" style="font-size: 1.5rem; letter-spacing: 4px; font-family: 'Courier New', Courier, monospace; color: #2c3e50; transform: skew(-5deg);">P7K2M9</span>
                            <!-- simple line overlay -->
                            <div class="position-absolute w-100" style="height: 2px; background: rgba(0,0,0,0.5); transform: rotate(-5deg); top: 50%;"></div>
                            <div class="position-absolute w-100" style="height: 1px; background: rgba(0,0,0,0.3); transform: rotate(10deg); top: 40%;"></div>
                        </div>
                        <button type="button" class="btn btn-outline-secondary" title="Refresh Captcha" style="height: 45px;" onclick="alert('Refreshed CAPTCHA')">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <div class="mt-2">
                        <input type="text" class="form-control" placeholder="Enter CAPTCHA text" autocomplete="off" required>
                    </div>
                </div>
                
                <a type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background: #1565c0;" href="dashboard.html">
                    Secure Login
                </a>
                
            </form>
        </div>

        <div class="bg-light p-2 text-center border-top">
            <span class="text-muted" style="font-size: 0.8rem;">
                <i class="fas fa-lock text-success me-1"></i> Secure connection
            </span>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
